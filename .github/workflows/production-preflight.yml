name: Production read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kps-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node deployment/production-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  checks:
    needs: candidate
    uses: ./.github/workflows/ci.yml
  preflight:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_PREFLIGHT_ENABLED == 'true'
    environment: production
    runs-on: ${{ fromJSON(vars.PRODUCTION_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl
          coverage: none
      - name: Check approved egress, CA/hostname, identity, grants, ledger and schema (no DDL)
        run: node deployment/production-database.mjs preflight
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_DB_PORT: ${{ secrets.PRODUCTION_DB_PORT }}
          PRODUCTION_RO_USERNAME: ${{ secrets.PRODUCTION_RO_USERNAME }}
          PRODUCTION_RO_PASSWORD: ${{ secrets.PRODUCTION_RO_PASSWORD }}
          PRODUCTION_MIGRATOR_USERNAME: ${{ secrets.PRODUCTION_MIGRATOR_USERNAME }}
          PRODUCTION_MIGRATOR_PASSWORD: ${{ secrets.PRODUCTION_MIGRATOR_PASSWORD }}
          PRODUCTION_DB_CA_PEM: ${{ secrets.PRODUCTION_DB_CA_PEM }}
          PRODUCTION_DB_CA_SHA256: ${{ vars.PRODUCTION_DB_CA_SHA256 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readonly-${{ github.sha }}-${{ github.run_attempt }}
          path: production-preflight-evidence.json
          if-no-files-found: warn
          retention-days: 14
