name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate pull request flow
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$BASE_BRANCH" in
            staging)
              case "$HEAD_BRANCH" in
                feature/*|fix/*|refactor/*|hotfix/*) ;;
                *)
                  echo "Pull requests into staging must come from feature/*, fix/*, refactor/*, or hotfix/*."
                  exit 1
                  ;;
              esac
              ;;
            main)
              case "$HEAD_BRANCH" in
                staging|hotfix/*) ;;
                *)
                  echo "Pull requests into main must come from staging or an approved hotfix/* branch."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported pull request base branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  frontend-browser:
    name: Frontend browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install browser system dependencies
        timeout-minutes: 2
        run: npx playwright install-deps chromium

      - name: Install Chromium headless shell
        timeout-minutes: 2
        run: npx playwright install --only-shell chromium

      - name: Run frontend browser tests
        timeout-minutes: 7
        run: npx playwright test --config playwright.report-validation.config.ts

      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failure
          path: test-results/report-validation/
          if-no-files-found: ignore
          retention-days: 7

  # Keep the required check name stable for existing branch protection rules.
  frontend:
    name: Frontend
    needs: [frontend-checks, frontend-browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require both frontend jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.frontend-browser.result }}
        run: |
          set -euo pipefail
          echo "Frontend checks: $CHECKS_RESULT"
          echo "Frontend browser tests: $BROWSER_RESULT"
          if [[ "$CHECKS_RESULT" != "success" || "$BROWSER_RESULT" != "success" ]]; then
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      KPS_DATABASE_ENVIRONMENT: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      WEEKLY_PLAN_STORAGE_DISK: local
      KPS_AI_DRIVER: fake
      WEEKLY_PLAN_DOCUMENT_AI_DRIVER: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, zip, xml
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check backend formatting
        run: vendor/bin/pint --test -v

      - name: Run backend tests
        run: php artisan test

      - name: Verify staging AI acceptance loader
        run: php ../tools/test-kps-ai-acceptance.php

      - name: Parse PowerShell acceptance loader
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ../tools/New-KpsAiAcceptance.ps1).Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  backend-container:
    name: Backend container build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image without publishing
        run: docker build --file backend/Dockerfile --tag kps-backend-ci backend

      - name: Verify startup, routing and concurrent health response
        shell: pwsh
        run: ./backend/scripts/Test-ProductionContainer.ps1 -Image kps-backend-ci -SkipBuild

      - name: Verify AI worker restart and graceful shutdown
        run: python3 backend/tests/Deployment/test-ai-supervisor.py
