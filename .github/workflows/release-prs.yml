name: Release PR maintenance

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kps-release-prs
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          script: |
            const { reconcile } = await import(`${process.env.GITHUB_WORKSPACE}/deployment/release-prs.mjs`);
            await reconcile(github, context.repo, core);
